name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build the world (ata + extensions + all skills)
        run: bun run build

      - name: Tests (unit + skills contract)
        run: bunx vitest run

      - name: Skills release digest verification
        run: bun run test:skills-release

      - name: Skills drift check self-test
        run: bun run test:skills-drift

      # The only step here that talks to the network. It fails the build when the
      # vendored catalog is behind the published one, and exits clean (with a
      # warning annotation) when the bucket cannot be reached — a busy upstream is
      # not drift. See the header of scripts/skills-drift-check.mjs.
      - name: Skills registry drift vs published catalog
        run: bun run check:skills-drift

      - name: Shared skills inheritance contract
        run: sudo -E sh test/shared-skills-install.test.sh
